version: "3.9"

services:
  app:
    image: ayushsingh0/devops-project:v1

    container_name: devops-container

    restart: always

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          